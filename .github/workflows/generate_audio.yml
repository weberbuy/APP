name: Generate 1200 Audio Files

on:
  workflow_dispatch: # 允許在 GitHub 網頁 Actions 頁面手動點擊執行

# ★ 關鍵修正：給予 GitHub Actions Bot 自動 Push 推送檔案的寫入權限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Run Audio Generator
        run: python3 generate_audio_1200.py

      - name: Commit and push audio files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 加入產生的音檔資料夾
          git add WordChecking/data/audio/

          # 檢查暫存區是否有變更，有變更才進行 commit 與 push
          if ! git diff --staged --quiet; then
            git commit -m "Generate 1200 audio files [skip ci]"
            git push origin main
          else
            echo "No changes to commit. Everything is up to date."
          fi
