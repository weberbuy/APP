name: Generate 1200 Audio Files

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊 Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install gTTS

      - name: Generate Audio Files
        run: |
          python scripts/generate_audio.py

      - name: Commit and push audio files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 加入產生的音檔資料夾
          git add WordChecking/data/audio/

          # 檢查暫存區是否有變更，有變更才進行 commit 與 push
          if ! git diff --staged --quiet; then
            git commit -m "Generate 1200 audio files [skip ci]"
            git push origin main
          else
            echo "No changes to commit. Everything is up to date."
          fi
